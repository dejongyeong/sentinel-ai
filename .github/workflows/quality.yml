name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Phase 1 CI quality checks (P1-OD-06): lint, format verification,
        # type checking, tests. Each runs the root package.json script.
        check: [lint, "format:check", typecheck, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up uv (version from pyproject.toml required-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install JavaScript dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Python environment (locked)
        run: uv sync --locked

      - name: Verify toolchain versions (fail-closed)
        run: |
          set -euo pipefail
          fail() { echo "RECORD|CI-TOOLCHAIN|FAIL|STOP|$1"; exit 1; }
          want_node="$(tr -d '[:space:]' < .node-version)"
          want_python="$(tr -d '[:space:]' < .python-version)"
          want_pnpm="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          want_uv="$(sed -nE 's/^required-version = "==([0-9.]+)"$/\1/p' pyproject.toml)"
          [[ -n "${want_uv}" ]] || fail "uv required-version not found in pyproject.toml"
          have_node="$(node -v)"
          have_pnpm="$(pnpm -v)"
          have_uv="$(uv --version | awk '{print $2}')"
          have_python="$(uv run --locked python -c 'import platform; print(platform.python_version())')"
          [[ "${have_node}" == "v${want_node}" ]] || fail "node ${have_node} != v${want_node}"
          [[ "${have_pnpm}" == "${want_pnpm}" ]] || fail "pnpm ${have_pnpm} != ${want_pnpm}"
          [[ "${have_uv}" == "${want_uv}" ]] || fail "uv ${have_uv} != ${want_uv}"
          [[ "${have_python}" == "${want_python}" ]] || fail "python ${have_python} != ${want_python}"
          echo "RECORD|CI-TOOLCHAIN|PASS|CONTINUE|node=${have_node}; pnpm=${have_pnpm}; uv=${have_uv}; python=${have_python}"

      - name: Run quality check
        env:
          CHECK: ${{ matrix.check }}
        run: pnpm run "${CHECK}"
