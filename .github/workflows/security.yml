name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks-positive-control:
    name: Secret scanning positive control
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Gitleaks version governed by docs/decisions/decision-register.md (DR-P0-001).
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz as published in the official
      # release checksums file (gitleaks_8.30.1_checksums.txt), independently verified.
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          workdir="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${workdir}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${workdir}/${archive}" | sha256sum -c -
          tar -xzf "${workdir}/${archive}" -C "${workdir}" gitleaks
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          install -m 0755 "${workdir}/gitleaks" "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          rm -rf "${workdir}"

      - name: Run positive control
        # Generates a synthetic fixture at runtime in a temporary directory outside
        # the checkout, requires detection by rule github-pat, asserts the token is
        # absent from the repository, and removes the fixture on exit.
        run: bash scripts/checks/gitleaks-controls.sh

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
